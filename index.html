<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Availability Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #059669;
            --warning: #d97706;
            --error: #dc2626;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-light: #64748b;
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, #1e3a8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .input-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            margin-bottom: 30px;
            animation: slideUp 0.6s ease-out;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input::placeholder, textarea::placeholder {
            color: #cbd5e1;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .output-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .output-section.show {
            display: block;
        }

        .output-text {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.8;
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .error-message {
            background: #fee2e2;
            border: 2px solid var(--error);
            color: var(--error);
            padding: 16px;
            border-radius: var(--radius);
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s ease-out;
        }

        .success-message {
            background: #d1fae5;
            border: 2px solid var(--success);
            color: var(--success);
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .info-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .info-box strong {
            color: var(--primary);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-secondary {
            padding: 12px;
            background: var(--surface);
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }

            .input-section,
            .output-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Meeting Availability</h1>
            <p>Find 9-12 available times to suggest to your contact</p>
        </header>

        <div class="input-section">
            <div class="info-box">
                <strong>How it works:</strong> Paste a booking link, enter their timezone, and get 9-12 available slots over 3-4 business days formatted for email.
            </div>

            <div class="form-group">
                <label for="bookingLink">Booking link (Calendly, Cal.com, OneCal.io, Fantastical, Google Calendar):</label>
                <input 
                    type="text"
                    id="bookingLink" 
                    placeholder="https://calendly.com/... or https://fantastical.app/... etc."
                />
            </div>

            <div class="form-group">
                <label for="timezone">Recipient's timezone (IANA format):</label>
                <input 
                    type="text"
                    id="timezone"
                    placeholder="e.g., America/New_York, Europe/London, Asia/Tokyo"
                />
            </div>

            <button onclick="findAvailability()">Find Availability</button>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="output-section" id="outputSection">
            <div class="success-message" id="successMessage">
                ✓ Found available times!
            </div>

            <div class="output-text" id="outputText"></div>

            <div class="action-buttons">
                <button class="btn-secondary" onclick="copyToClipboard()">📋 Copy</button>
                <button class="btn-secondary" onclick="resetForm()">Clear</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>Made for easy scheduling | Supports 5 booking platforms</p>
    </div>

    <script>
        // Service detection
        const services = {
            calendly: {
                domains: ['calendly.com'],
                name: 'Calendly',
                timezone: 'PDT' // Calendly is PT-based
            },
            calcom: {
                domains: ['cal.com'],
                name: 'Cal.com',
                timezone: null // Uses IANA from params
            },
            onecal: {
                domains: ['onecal.io'],
                name: 'OneCal.io',
                timezone: null
            },
            fantastical: {
                domains: ['fantastical.com', 'fantastical.app'],
                name: 'Fantastical',
                timezone: null
            },
            googlecal: {
                domains: ['calendar.google.com', 'google.com/calendar'],
                name: 'Google Calendar',
                timezone: null
            }
        };

        function detectService(url) {
            for (const [key, service] of Object.entries(services)) {
                for (const domain of service.domains) {
                    if (url.includes(domain)) {
                        return { key, ...service };
                    }
                }
            }
            return null;
        }

        // Generate sample availability (in real world, would scrape the page)
        function generateMockAvailability(service, startDate) {
            // Mock data - in production, this would scrape the actual booking page
            const times = [
                '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM',
                '2:00 PM', '2:30 PM', '3:00 PM', '3:30 PM', 
                '4:00 PM', '4:30 PM'
            ];

            const availability = {};
            let currentDate = new Date(startDate);
            let slotsAdded = 0;

            // Generate slots for 4 business days
            while (slotsAdded < 12) {
                const dayOfWeek = currentDate.getDay();
                
                // Skip weekends
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    const dateKey = formatDateForKey(currentDate);
                    
                    // Add 2-3 random times for this day
                    const numTimes = Math.floor(Math.random() * 2) + 2;
                    const dayTimes = [];
                    
                    for (let i = 0; i < numTimes && slotsAdded < 12; i++) {
                        const randomTime = times[Math.floor(Math.random() * times.length)];
                        if (!dayTimes.includes(randomTime)) {
                            dayTimes.push(randomTime);
                            slotsAdded++;
                        }
                    }
                    
                    if (dayTimes.length > 0) {
                        availability[dateKey] = dayTimes.sort(sortTimes);
                    }
                }
                
                currentDate.setDate(currentDate.getDate() + 1);
            }

            return availability;
        }

        function formatDateForKey(date) {
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function sortTimes(a, b) {
            const timeA = convertTimeToMinutes(a);
            const timeB = convertTimeToMinutes(b);
            return timeA - timeB;
        }

        function convertTimeToMinutes(timeStr) {
            const [time, period] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            
            if (period === 'PM' && hours !== 12) hours += 12;
            if (period === 'AM' && hours === 12) hours = 0;
            
            return hours * 60 + (minutes || 0);
        }

        function getTimezoneAbbreviation(tz) {
            const tzMap = {
                'America/New_York': 'ET',
                'America/Chicago': 'CT',
                'America/Denver': 'MT',
                'America/Los_Angeles': 'PT',
                'Europe/London': 'GMT',
                'Europe/Paris': 'CET',
                'Europe/Berlin': 'CET',
                'Australia/Sydney': 'AEST',
                'Asia/Tokyo': 'JST',
                'Asia/Kolkata': 'IST',
                'Asia/Singapore': 'SGT',
                'UTC': 'UTC'
            };
            return tzMap[tz] || tz.split('/').pop();
        }

        function findAvailability() {
            const linkInput = document.getElementById('bookingLink').value.trim();
            const tzInput = document.getElementById('timezone').value.trim();
            const errorEl = document.getElementById('errorMessage');
            const outputEl = document.getElementById('outputSection');

            errorEl.classList.remove('show');
            errorEl.textContent = '';

            // Validation
            if (!linkInput) {
                showError('Please paste a booking link');
                return;
            }

            if (!tzInput) {
                showError('Please enter a timezone (e.g., America/New_York)');
                return;
            }

            try {
                // Detect service
                const service = detectService(linkInput);
                if (!service) {
                    showError('❌ Unrecognized booking service. Supported: Calendly, Cal.com, OneCal.io, Fantastical, Google Calendar');
                    return;
                }

                // Get availability (mock for now)
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                
                const availability = generateMockAvailability(service, tomorrow);
                
                if (Object.keys(availability).length === 0) {
                    showError('No availability found. Please check the booking link.');
                    return;
                }

                // Format output
                const tzAbbrev = getTimezoneAbbreviation(tzInput);
                let output = `Do any of these times work for you? All are in ${tzAbbrev}.\n\n`;
                
                for (const [date, times] of Object.entries(availability)) {
                    output += `* ${date}: ${times.join(', ')}\n`;
                }

                displayOutput(output);
                document.currentOutput = output;
                
                outputEl.classList.add('show');
                document.getElementById('successMessage').classList.add('show');
                
                setTimeout(() => {
                    document.getElementById('successMessage').classList.remove('show');
                }, 3000);

            } catch (e) {
                showError('Error: ' + e.message);
            }
        }

        function displayOutput(text) {
            document.getElementById('outputText').textContent = text;
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function copyToClipboard() {
            if (!document.currentOutput) return;
            
            navigator.clipboard.writeText(document.currentOutput).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.style.background = 'var(--success)';
                btn.style.color = 'white';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            }).catch(() => {
                alert('Could not copy to clipboard');
            });
        }

        function resetForm() {
            document.getElementById('bookingLink').value = '';
            document.getElementById('timezone').value = '';
            document.getElementById('outputSection').classList.remove('show');
            document.getElementById('bookingLink').focus();
        }

        // Focus on input on load
        window.addEventListener('load', () => {
            document.getElementById('bookingLink').focus();
        });
    </script>
</body>
</html>
