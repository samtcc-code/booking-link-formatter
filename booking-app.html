<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Link Formatter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #059669;
            --warning: #d97706;
            --error: #dc2626;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-light: #64748b;
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, #1e3a8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .input-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            margin-bottom: 30px;
            animation: slideUp 0.6s ease-out;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea::placeholder {
            color: #cbd5e1;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .output-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .output-section.show {
            display: block;
        }

        .booking-card {
            border-left: 5px solid var(--primary);
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .booking-detail {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
        }

        .booking-detail:last-child {
            margin-bottom: 0;
        }

        .detail-emoji {
            font-size: 1.4rem;
            width: 30px;
            margin-right: 15px;
            text-align: center;
        }

        .detail-content {
            flex: 1;
        }

        .detail-label {
            font-size: 0.8rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 1.1rem;
            color: var(--text);
            font-weight: 500;
        }

        .detail-value.link {
            color: var(--primary);
            text-decoration: none;
            word-break: break-all;
            cursor: pointer;
        }

        .detail-value.link:hover {
            text-decoration: underline;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid var(--border);
        }

        .btn-secondary {
            padding: 12px;
            background: var(--surface);
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
            border: none;
        }

        .btn-success:hover {
            background: #047857;
        }

        .error-message {
            background: #fee2e2;
            border: 2px solid var(--error);
            color: var(--error);
            padding: 16px;
            border-radius: var(--radius);
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s ease-out;
        }

        .success-message {
            background: #d1fae5;
            border: 2px solid var(--success);
            color: var(--success);
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .service-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .info-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .info-box strong {
            color: var(--primary);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }

            .input-section,
            .output-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Booking Link Formatter</h1>
            <p>Paste a booking link • Get clean details • Copy to email</p>
        </header>

        <div class="input-section">
            <div class="info-box">
                <strong>Supports:</strong> Calendly • Cal.com • OneCal.io • Fantastical • Google Calendar
            </div>

            <div class="form-group">
                <label for="bookingLink">Paste your booking link:</label>
                <textarea 
                    id="bookingLink" 
                    placeholder="https://calendly.com/... or https://cal.com/... etc."
                ></textarea>
            </div>

            <button onclick="formatLink()">Format Link</button>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="output-section" id="outputSection">
            <div class="success-message" id="successMessage">
                ✓ Link formatted successfully!
            </div>

            <div id="bookingDetails"></div>

            <div class="action-buttons">
                <button class="btn-secondary" onclick="copyToClipboard()">📋 Copy Details</button>
                <button class="btn-secondary btn-success" onclick="openLink()">🔗 Open Link</button>
            </div>

            <button class="btn-secondary" style="margin-top: 12px;" onclick="resetForm()">Format Another</button>
        </div>
    </div>

    <div class="footer">
        <p>Made with ❤️ for your team | <a href="#" onclick="showSupported()">Need help?</a></p>
    </div>

    <script>
        // Service detection and parsing
        const services = {
            calendly: {
                domain: 'calendly.com',
                name: 'Calendly',
                emoji: '📅',
                parse: parseCalendly
            },
            calcom: {
                domain: 'cal.com',
                name: 'Cal.com',
                emoji: '📆',
                parse: parseCalCom
            },
            onecal: {
                domain: 'onecal.io',
                name: 'OneCal.io',
                emoji: '🗓️',
                parse: parseOneCal
            },
            fantastical: {
                domain: 'fantastical.com',
                name: 'Fantastical',
                emoji: '✨',
                parse: parseFantastical
            },
            googlecal: {
                domain: 'calendar.google.com',
                name: 'Google Calendar',
                emoji: '🔵',
                parse: parseGoogleCal
            }
        };

        function detectService(url) {
            for (const [key, service] of Object.entries(services)) {
                if (url.includes(service.domain)) {
                    return { key, ...service };
                }
            }
            return null;
        }

        function parseCalendly(url) {
            try {
                const urlObj = new URL(url);
                const pathParts = urlObj.pathname.split('/').filter(p => p);
                
                if (pathParts.length < 2) throw new Error('Invalid Calendly URL');

                const username = pathParts[0];
                const eventName = pathParts[1];
                
                const date = urlObj.searchParams.get('date') || extractDateFromPath(urlObj.pathname);
                const time = urlObj.searchParams.get('time')?.replace('%3A', ':') || extractTimeFromPath(urlObj.pathname);
                const month = urlObj.searchParams.get('month');
                
                // Parse timezone from path
                const pathStr = urlObj.pathname;
                let timezone = 'PDT';
                let utcOffset = 'UTC-7';
                if (pathStr.includes('T')) {
                    const offsetMatch = pathStr.match(/([-+]\d{2}):?(\d{2})$/);
                    if (offsetMatch) {
                        const offset = parseInt(offsetMatch[1]);
                        utcOffset = offset >= 0 ? `UTC+${offset}` : `UTC${offset}`;
                        timezone = offset === -7 ? 'PDT' : offset === -8 ? 'PST' : getTimezoneName(offset);
                    }
                }

                const details = {
                    service: 'Calendly',
                    organizer: username,
                    event: formatEventName(eventName),
                    date: formatDate(date),
                    time: formatTime(time),
                    timezone: timezone,
                    utcOffset: utcOffset,
                    duration: '30 minutes',
                    link: url
                };

                return details;
            } catch (e) {
                throw new Error('Could not parse Calendly link: ' + e.message);
            }
        }

        function parseCalCom(url) {
            try {
                const urlObj = new URL(url);
                const pathParts = urlObj.pathname.split('/').filter(p => p);
                
                if (pathParts.length < 2) throw new Error('Invalid Cal.com URL');

                const username = pathParts[0];
                const eventSlug = pathParts[1];
                const date = urlObj.searchParams.get('date');
                const time = urlObj.searchParams.get('time');
                const tzParam = urlObj.searchParams.get('tz') || 'UTC';

                const details = {
                    service: 'Cal.com',
                    organizer: username,
                    event: formatEventName(eventSlug),
                    date: formatDate(date),
                    time: formatTime(time),
                    timezone: getTimezoneName(tzParam),
                    utcOffset: getUtcOffset(tzParam),
                    duration: extractDurationFromSlug(eventSlug),
                    link: url
                };

                return details;
            } catch (e) {
                throw new Error('Could not parse Cal.com link: ' + e.message);
            }
        }

        function parseOneCal(url) {
            try {
                const urlObj = new URL(url);
                const pathParts = urlObj.pathname.split('/').filter(p => p);
                
                if (pathParts.length < 2) throw new Error('Invalid OneCal.io URL');

                const username = pathParts[0];
                const eventSlug = pathParts[1];
                const date = urlObj.searchParams.get('date');
                const time = urlObj.searchParams.get('time');
                const tzParam = urlObj.searchParams.get('tz') || 'UTC';

                const details = {
                    service: 'OneCal.io',
                    organizer: username,
                    event: formatEventName(eventSlug),
                    date: formatDate(date),
                    time: formatTime(time),
                    timezone: getTimezoneName(tzParam),
                    utcOffset: getUtcOffset(tzParam),
                    duration: 'Not specified',
                    link: url
                };

                return details;
            } catch (e) {
                throw new Error('Could not parse OneCal.io link: ' + e.message);
            }
        }

        function parseFantastical(url) {
            try {
                const urlObj = new URL(url);
                const eventHash = urlObj.pathname.split('/').filter(p => p)[1];
                const date = urlObj.searchParams.get('date');
                const time = urlObj.searchParams.get('time');
                const tzParam = urlObj.searchParams.get('tz');

                if (!date || !time) {
                    return {
                        service: 'Fantastical',
                        organizer: 'Unknown',
                        event: 'Booking',
                        date: 'Not specified',
                        time: 'Opens time picker',
                        timezone: 'Your timezone',
                        utcOffset: 'Local',
                        duration: 'Not specified',
                        link: url,
                        note: 'This link opens a time picker for the recipient'
                    };
                }

                const details = {
                    service: 'Fantastical',
                    organizer: 'Unknown',
                    event: 'Booking',
                    date: formatDate(date),
                    time: formatTime(time),
                    timezone: tzParam ? getTimezoneName(tzParam) : 'Local',
                    utcOffset: tzParam ? getUtcOffset(tzParam) : 'Local',
                    duration: 'Not specified',
                    link: url
                };

                return details;
            } catch (e) {
                throw new Error('Could not parse Fantastical link: ' + e.message);
            }
        }

        function parseGoogleCal(url) {
            try {
                const urlObj = new URL(url);
                const text = decodeURIComponent(urlObj.searchParams.get('text') || 'Meeting');
                const dates = urlObj.searchParams.get('dates');
                const tz = urlObj.searchParams.get('tz') || 'UTC';
                const details = decodeURIComponent(urlObj.searchParams.get('details') || '');
                const location = decodeURIComponent(urlObj.searchParams.get('location') || '');

                let date = '';
                let time = '';
                let duration = '';

                if (dates) {
                    const [start, end] = dates.split('/');
                    date = formatGoogleDate(start);
                    time = formatGoogleTime(start);
                    if (end) {
                        duration = calculateDuration(start, end);
                    }
                }

                const result = {
                    service: 'Google Calendar',
                    organizer: 'Your Calendar',
                    event: text,
                    date: date || 'Not specified',
                    time: time || 'Not specified',
                    timezone: getTimezoneName(tz),
                    utcOffset: getUtcOffset(tz),
                    duration: duration || 'Not specified',
                    link: url
                };

                if (location) result.location = location;
                if (details) result.details = details;

                return result;
            } catch (e) {
                throw new Error('Could not parse Google Calendar link: ' + e.message);
            }
        }

        // Helper functions
        function formatEventName(name) {
            return name
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ')
                .replace(/([0-9]+)min/, '$1-Minute');
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Not specified';
            const date = new Date(dateStr + 'T00:00:00');
            const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function formatGoogleDate(dateStr) {
            if (!dateStr || dateStr.length !== 8) return 'Not specified';
            const year = dateStr.substring(0, 4);
            const month = dateStr.substring(4, 6);
            const day = dateStr.substring(6, 8);
            return formatDate(`${year}-${month}-${day}`);
        }

        function formatTime(timeStr) {
            if (!timeStr) return 'Not specified';
            const [hours, minutes] = timeStr.split(':');
            const hour = parseInt(hours);
            const min = parseInt(minutes) || 0;
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;
            return `${displayHour}:${min.toString().padStart(2, '0')} ${ampm}`;
        }

        function formatGoogleTime(dateTimeStr) {
            if (!dateTimeStr || dateTimeStr.length < 9) return 'Not specified';
            const hours = dateTimeStr.substring(9, 11);
            const minutes = dateTimeStr.substring(11, 13);
            const hour = parseInt(hours);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;
            return `${displayHour}:${minutes} ${ampm}`;
        }

        function extractDurationFromSlug(slug) {
            const match = slug.match(/(\d+).*?(min|hour)/i);
            if (match) {
                const num = match[1];
                const unit = match[2].toLowerCase();
                return unit === 'hour' ? `${num} hour${num > 1 ? 's' : ''}` : `${num} minutes`;
            }
            return '30 minutes';
        }

        function extractDateFromPath(path) {
            const dateMatch = path.match(/(\d{4})-(\d{2})-(\d{2})/);
            return dateMatch ? `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}` : '';
        }

        function extractTimeFromPath(path) {
            const timeMatch = path.match(/T(\d{2}):(\d{2})/);
            return timeMatch ? `${timeMatch[1]}:${timeMatch[2]}` : '';
        }

        function calculateDuration(start, end) {
            if (start.length < 8 || end.length < 8) return 'Not specified';
            const startMin = parseInt(start.substring(9, 13), 10);
            const endMin = parseInt(end.substring(9, 13), 10);
            const duration = endMin - startMin;
            return duration <= 0 ? 'Not specified' : `${duration} minutes`;
        }

        function getTimezoneName(tz) {
            const tzMap = {
                'America/New_York': 'ET',
                'America/Chicago': 'CT',
                'America/Denver': 'MT',
                'America/Los_Angeles': 'PT',
                'Europe/London': 'GMT',
                'Europe/Paris': 'CET',
                'Australia/Sydney': 'AEST',
                'Asia/Tokyo': 'JST',
                'Asia/Kolkata': 'IST',
                'UTC': 'UTC'
            };
            return tzMap[tz] || tz.substring(tz.lastIndexOf('/') + 1);
        }

        function getUtcOffset(tz) {
            const offsetMap = {
                'America/New_York': 'UTC-5 (ET)',
                'America/Chicago': 'UTC-6 (CT)',
                'America/Denver': 'UTC-7 (MT)',
                'America/Los_Angeles': 'UTC-8 (PT)',
                'Europe/London': 'UTC+0',
                'Europe/Paris': 'UTC+1',
                'Australia/Sydney': 'UTC+10',
                'Asia/Tokyo': 'UTC+9',
                'Asia/Kolkata': 'UTC+5:30',
                'UTC': 'UTC+0'
            };
            return offsetMap[tz] || 'Unknown';
        }

        // Main functions
        function formatLink() {
            const input = document.getElementById('bookingLink').value.trim();
            const errorEl = document.getElementById('errorMessage');
            const outputEl = document.getElementById('outputSection');

            errorEl.classList.remove('show');
            errorEl.textContent = '';

            if (!input) {
                showError('Please paste a booking link');
                return;
            }

            try {
                const service = detectService(input);
                if (!service) {
                    showError('Unrecognized booking service. Supported: Calendly, Cal.com, OneCal.io, Fantastical, Google Calendar');
                    return;
                }

                const details = service.parse(input);
                displayResults(details);
                outputEl.classList.add('show');
                document.getElementById('successMessage').classList.add('show');
                
                setTimeout(() => {
                    document.getElementById('successMessage').classList.remove('show');
                }, 3000);
            } catch (e) {
                showError(e.message);
            }
        }

        function displayResults(details) {
            const html = `
                <div class="booking-card">
                    <span class="service-badge">${details.service}</span>

                    <div class="booking-detail">
                        <div class="detail-emoji">👤</div>
                        <div class="detail-content">
                            <div class="detail-label">Organizer</div>
                            <div class="detail-value">${details.organizer || 'Unknown'}</div>
                        </div>
                    </div>

                    <div class="booking-detail">
                        <div class="detail-emoji">📍</div>
                        <div class="detail-content">
                            <div class="detail-label">Event</div>
                            <div class="detail-value">${details.event || 'Booking'}</div>
                        </div>
                    </div>

                    <div class="booking-detail">
                        <div class="detail-emoji">📅</div>
                        <div class="detail-content">
                            <div class="detail-label">Date</div>
                            <div class="detail-value">${details.date}</div>
                        </div>
                    </div>

                    <div class="booking-detail">
                        <div class="detail-emoji">⏰</div>
                        <div class="detail-content">
                            <div class="detail-label">Time</div>
                            <div class="detail-value">${details.time} ${details.timezone} (${details.utcOffset})</div>
                        </div>
                    </div>

                    <div class="booking-detail">
                        <div class="detail-emoji">⏱️</div>
                        <div class="detail-content">
                            <div class="detail-label">Duration</div>
                            <div class="detail-value">${details.duration}</div>
                        </div>
                    </div>

                    ${details.location ? `
                    <div class="booking-detail">
                        <div class="detail-emoji">📌</div>
                        <div class="detail-content">
                            <div class="detail-label">Location</div>
                            <div class="detail-value">${details.location}</div>
                        </div>
                    </div>
                    ` : ''}

                    <div class="booking-detail">
                        <div class="detail-emoji">🔗</div>
                        <div class="detail-content">
                            <div class="detail-label">Booking Link</div>
                            <div class="detail-value link" onclick="copyToClipboard()">${truncateUrl(details.link)}</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('bookingDetails').innerHTML = html;
            document.currentDetails = details;
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = '❌ ' + message;
            errorEl.classList.add('show');
        }

        function truncateUrl(url) {
            return url.length > 60 ? url.substring(0, 60) + '...' : url;
        }

        function copyToClipboard() {
            if (!document.currentDetails) return;
            
            const d = document.currentDetails;
            const text = `${d.event}
${d.date} at ${d.time} ${d.timezone}

${d.link}`;

            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.style.background = 'var(--success)';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 2000);
            }).catch(() => {
                alert('Could not copy to clipboard');
            });
        }

        function openLink() {
            if (document.currentDetails) {
                window.open(document.currentDetails.link, '_blank');
            }
        }

        function resetForm() {
            document.getElementById('bookingLink').value = '';
            document.getElementById('outputSection').classList.remove('show');
            document.getElementById('bookingLink').focus();
        }

        function showSupported() {
            alert('Supported services:\n\n✓ Calendly (calendly.com)\n✓ Cal.com (cal.com)\n✓ OneCal.io (onecal.io)\n✓ Fantastical (fantastical.com)\n✓ Google Calendar (calendar.google.com)\n\nPaste any booking link above and click "Format Link"');
        }

        // Focus on input on load
        window.addEventListener('load', () => {
            document.getElementById('bookingLink').focus();
        });

        // Allow Enter to submit
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('bookingLink').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    formatLink();
                }
            });
        });
    </script>
</body>
</html>
